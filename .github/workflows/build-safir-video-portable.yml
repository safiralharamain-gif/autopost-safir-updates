name: Build SAFIR Video Portable

on:
  push:
    branches:
      - build/safir-video-portable-v3
    paths:
      - 'safir-video-build/**'
      - '.github/workflows/build-safir-video-portable.yml'
  workflow_dispatch:


concurrency:
  group: safir-video-portable-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: safir-video-build
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        working-directory: safir-video-build
        run: npm run check

      - name: Build local Arabic speech engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git whisper-src
          cmake -S whisper-src -B whisper-src/build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper-src/build --config Release --target whisper-cli -j 2
          New-Item -ItemType Directory -Force -Path safir-video-build/ai | Out-Null
          Copy-Item whisper-src/build/bin/Release/whisper-cli.exe safir-video-build/ai/whisper-cli.exe
          curl.exe -L --retry 3 --retry-delay 3 -o safir-video-build/ai/ggml-base.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true"
          if ((Get-Item safir-video-build/ai/ggml-base.bin).Length -lt 100000000) { throw "Whisper model download is incomplete" }
          & safir-video-build/ai/whisper-cli.exe -h | Out-Null

      - name: Smoke test local Arabic speech engine
        working-directory: safir-video-build
        run: node tests/whisper-engine-smoke.js

      - name: Smoke test manual timeline render
        working-directory: safir-video-build
        run: node tests/manual-timeline-smoke.js

      - name: Build Windows Portable EXE
        working-directory: safir-video-build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:win

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "safir-video-build/dist" -Filter "*.exe"
          if (-not $files) { throw "No EXE was produced" }
          $files | ForEach-Object { Write-Host $_.FullName $_.Length }

      - name: Smoke test EXE launch
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "safir-video-build/dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE not found for smoke test" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "EXE exited during smoke test with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed: EXE stayed running."

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: safir-video-portable-windows
          path: safir-video-build/dist/*.exe
          if-no-files-found: error
          retention-days: 7
